<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPCEN - News & Updates</title>
    
    <!-- Upgraded to 6.5.1 to match the dashboard -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
    
    <!-- 1. UPDATED SIDEBAR WITH ICONS AND SPANS -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-shield-halved"></i> <span>CDRRMD</span></h2>
            <p><span>Operation Center</span></p>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> <span>Main</span></a>
            <a href="resource.html" class="nav-item"><i class="fa-solid fa-truck-medical"></i> <span>Resource</span></a>
            <a href="report.html" class="nav-item"><i class="fa-solid fa-file-lines"></i> <span>Report</span></a>
            <a href="weather.html" class="nav-item"><i class="fa-solid fa-cloud-sun"></i> <span>Weather</span></a>
            <a href="news.html" class="nav-item active"><i class="fa-solid fa-newspaper"></i> <span>News</span></a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            
            <!-- 2. UPDATED HEADER WITH TOGGLE BUTTON -->
            <div style="margin-bottom: 25px;">
                <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 8px;">
                    <!-- The Sidebar Toggle Button -->
                    <button id="sidebarToggle" class="sidebar-toggle" style="margin-bottom: 0;">
                        <i class="fa-solid fa-angles-left"></i>
                    </button>
                    <h1 class="header-title" style="margin: 0;">News & Updates</h1>
                </div>
                <p style="color: #64748b; margin: 0; font-size: 0.95rem;">Live announcements, advisories, and updates from the official CDRRMD - Butuan Facebook Page.</p>
            </div>

            <!-- News Feed Container -->
            <div class="card news-panel">
                <div id="fb-feed-container" class="news-feed-grid">
                    <!-- Loading state centered in grid -->
                    <div class="news-loading" style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #64748b;">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Fetching live posts from Facebook...
                    </div>
                </div>
            </div>
            
        </div>
    </main>
</div>

<!-- 3. TOGGLE LOGIC EMBEDDED FOR THIS PAGE -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const sidebar = document.querySelector('.sidebar');
    const toggleBtn = document.getElementById('sidebarToggle');

    if (toggleBtn && sidebar) {
        toggleBtn.addEventListener('click', () => {
            // Toggles the shrink effect
            sidebar.classList.toggle('collapsed');
            
            // Flips the angles icon direction
            const icon = toggleBtn.querySelector('i');
            if (sidebar.classList.contains('collapsed')) {
                icon.classList.remove('fa-angles-left');
                icon.classList.add('fa-angles-right');
            } else {
                icon.classList.remove('fa-angles-right');
                icon.classList.add('fa-angles-left');
            }
        });
    }
});
</script>

<script src="js/news.js"></script>

<script async type='module' src='https://interfaces.zapier.com/assets/web-components/zapier-interfaces/zapier-interfaces.esm.js'></script>

</body>
</html>
